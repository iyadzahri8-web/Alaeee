
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رسالة إلى الاء ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffe0ec, #e7d5ff);
  overflow: hidden;
}

.card {
  background: white;
  width: 90%;
  max-width: 400px;
  padding: 35px 20px;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 10px 40px #0002;
}

h2 {
  color: #e84379;
  font-size: 25px;
}

p {
  color: #777;
}

.buttons {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
  margin-top: 30px;
  min-height: 55px;
}

button {
  border: none;
  border-radius: 14px;
  padding: 13px 28px;
  font-size: 18px;
  cursor: pointer;
  font-weight: bold;
}

.yes, .sure {
  background: #ff5c93;
  color: white;
}

.no {
  background: #eeeeee;
  color: #444;
  transition: left 0.12s, top 0.12s;
}

.heart {
  font-size: 42px;
  animation: beat 1s infinite alternate;
}

@keyframes beat {
  to { transform: scale(1.15); }
}
</style>
</head>

<body>
<div class="card" id="card">
  <div class="heart">💗</div>
  <h2>هل أنتِ الاء؟ 🥹</h2>
  <p>جاوبي بصراحة برك 👀</p>

  <div class="buttons">
    <button class="yes" onclick="nextPage(2)">نعم ❤️</button>
    <button class="no" id="noBtn">لا 🙄</button>
  </div>
</div>

<script>
const card = document.getElementById("card");
let currentPage = 1;

function moveNoButton() {
  const btn = document.getElementById("noBtn");
  if (!btn) return;

  btn.style.position = "fixed";

  const maxX = window.innerWidth - btn.offsetWidth - 10;
  const maxY = window.innerHeight - btn.offsetHeight - 10;

  btn.style.left = Math.max(10, Math.random() * maxX) + "px";
  btn.style.top = Math.max(10, Math.random() * maxY) + "px";
}

function activateNo() {
  const btn = document.getElementById("noBtn");
  if (!btn) return;

  btn.addEventListener("pointerenter", moveNoButton);
  btn.addEventListener("touchstart", function(e) {
    e.preventDefault();
    moveNoButton();
  }, { passive: false });

  btn.addEventListener("click", function(e) {
    e.preventDefault();
    moveNoButton();
  });
}

function nextPage(page) {
  currentPage = page;

  if (page === 2) {
    card.innerHTML = `
      <div class="heart">💘</div>
      <h2>هل تحبين المهندس إياد؟ 😏</h2>
      <p>ديري حسابك، راهي إجابة مصيرية 😂</p>
      <div class="buttons">
        <button class="yes" onclick="nextPage(3)">نعم ❤️</button>
        <button class="no" id="noBtn">لا 😈</button>
      </div>
    `;
    activateNo();
  }

  else if (page === 3) {
    card.innerHTML = `
      <div class="heart">🥹💕</div>
      <h2>باينة تحبيني وشبيك هاذا 😔👈🏻👉🏻</h2>
      <p>خلاص خلاص، ما تزيديش تنكري 😂</p>
      <div class="buttons">
        <button class="sure" onclick="nextPage(4)">أكيد 😭❤️</button>
      </div>
    `;
  }

  else if (page === 4) {
    card.innerHTML = `
      <div class="heart">❤️‍🔥</div>
      <h2>مام أنا ديجا كيما تقولها يما شكون ميحبش الاء 😔👈🏻👉🏻</h2>
      <p style="font-size:23px">🥹💗🌹</p>
      <p>ربي يخلي الابتسامة ديما على وجهك يا الاء ❤️</p>
      <div class="heart">💞</div>
    `;
  }
}

activateNo();
</script>
</body>
</html>
